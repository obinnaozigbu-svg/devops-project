name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Adding EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 13.61.0.217 >> ~/.ssh/known_hosts

      - name: Prepare server
        run: |
          #Copy the custom config file from the github runner to the /tmp folder on EC2
          scp  -o StrictHostKeyChecking=no nginx/default.conf ubuntu@13.61.0.217:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@13.61.0.217 "

            set -e

            #Install Nginx if not installed
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install nginx -y
            fi

            #Create necessary directories
            sudo mkdir -p /var/www/staging/releases

            #Set ownership
            sudo chown -R ubuntu:ubuntu /var/www

            #Replace nginx default config file with the one in /tmp
            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            #Test
            sudo nginx -t

            #Restart nginx
            sudo systemctl restart nginx

          "

      - name: Deploy to Staging
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@13.61.0.217 "
            set -e  #Exit if any command fails

            #Ensure release folder exists
            mkdir -p /var/www/staging/releases

            #Create a unique release folder with timestamp
            NEW_RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            mkdir -p \$NEW_RELEASE
            echo "Deploying to:" \$NEW_RELEASE

            #Upload all files to the new release
            rsync -av --delete ~/devops-project/web/ \$NEW_RELEASE

            #Update symlink so that Nginx serves the new release from the staging folder
            ln -sfn \$NEW_RELEASE /var/www/staging/current
            echo "Deployment complete"
          "

      - name: Test Staging Deployment (Health Check)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@13.61.0.217 "
            STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://13.61.0.217/staging/index.html)
            if [ \'\$STATUS\' -ne 200 ]; then
              echo 'Staging failed'
              exit 1
            else
              echo 'Staging OK'
            fi

          "
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production    #triggers manual approval
    strategy:
      matrix:
        server: [13.62.18.144, 16.16.182.23]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Promote to Production
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.server }} "
            RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            ln -sfn \$RELEASE /var/www/html/current
          "


      - name: Rollback  #Runs if healthcheck fails
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.server }} "
            PREV_RELEASE=\$(ls -dt /var/www/staging/releases/* | sed -n '2p')
            if [ -n \'\$PREV_RELEASE\' ]; then
              ln -sfn \$PREV_RELEASE /var/www/html/current
              echo 'Rollback complete'
            else
              'No previous release to rollback to'
            fi
          "

      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Successful"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Failed!"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
