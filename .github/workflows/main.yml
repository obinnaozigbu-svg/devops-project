name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

env:
  STAGING_SERVER: 13.48.84.65
  PROD_SERVER_1: 13.60.8.170
  PROD_SERVER_2: 16.171.111.54

jobs:
  deploy-staging:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Adding EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.STAGING_SERVER }} >> ~/.ssh/known_hosts

      - name: Prepare server
        run: |
          #Copy the custom config file from the github runner to the /tmp folder on EC2
          scp  -o StrictHostKeyChecking=no nginx/default.conf ubuntu@${{ env.STAGING_SERVER }}:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "

            set -e

            #Install Nginx if not installed
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install nginx -y
            fi

            #Create necessary directories
            sudo mkdir -p /var/www/staging/releases

            #Set ownership
            sudo chown -R ubuntu:ubuntu /var/www

            #Replace nginx default config file with the one in /tmp
            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            #Test
            sudo nginx -t

            #Restart nginx
            sudo systemctl restart nginx

          "

      - name: Deploy to Staging
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "
            set -e  #Exit if any command fails

            #Ensure release folder exists
            mkdir -p /var/www/staging/releases

            #Create a unique release folder with timestamp
            NEW_RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            mkdir -p \$NEW_RELEASE
            echo "Deploying to:" \$NEW_RELEASE

            #Upload all files to the new release
            rsync -av --delete ~/devops-project/web/ \$NEW_RELEASE

            #Update symlink so that Nginx serves the new release from the staging folder
            ln -sfn \$NEW_RELEASE /var/www/staging/current
            echo "Deployment complete"
          "

      - name: Test Staging Deployment (Health Check)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "
            STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://${{ env.STAGING_SERVER }}/staging/index.html)
            if [ \'\$STATUS\' -ne 200 ]; then
              echo 'Staging failed'
              exit 1
            else
              echo 'Staging OK'
            fi

          "
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production    #triggers manual approval
    strategy:
      matrix:
        include:
          - name: prod-1
            ip: 13.60.8.170

          - name: prod-2
            ip: 16.171.111.54

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Prepare Servers
        run: |
          scp -o StrictHostKeyChecking=no nginx/default.conf ubuntu@${{ matrix.ip }}:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt upgrade
              sudo apt install nginx -y
            fi

            sudo mkdir -p /var/www/html
            sudo mkdir -p /var/www/staging/releases
            sudo chown -R ubuntu:ubuntu /var/www

            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            sudo nginx -t
            sudo systemctl restart nginx
          "

      - name: Promote to Production
        run: |

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            mkdir -p \$RELEASE
          "

          rsync -av --delete ./web/ ubuntu@${{ matrix.ip }}:/var/www/staging/releases/release-${{ github.sha }}

          ssh -o StrictHostKeyChecking=no ubuntu@${{matrix.ip }} "
            ln -sfn /var/www/staging/releases/release-${{ github.sha }} /var/www/html/current
          "



      - name: Rollback  #Runs if healthcheck fails
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            PREV_RELEASE=\$(ls -dt /var/www/staging/releases/* | sed -n '2p')
            if [ -n \'\$PREV_RELEASE\' ]; then
              ln -sfn \$PREV_RELEASE /var/www/html/current
              echo 'Rollback complete'
            else
              'No previous release to rollback to'
            fi
          "

      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Successful"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Failed!"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
