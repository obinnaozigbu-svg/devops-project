name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

env:
  STAGING_SERVER: 13.51.171.180

jobs:
  deploy-staging:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Adding EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.STAGING_SERVER }} >> ~/.ssh/known_hosts

      - name: Prepare server
        run: |
          #Copy the custom config file from the github runner to the /tmp folder on EC2
          scp  -o StrictHostKeyChecking=no nginx/default.conf ubuntu@${{ env.STAGING_SERVER }}:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "

            set -e

            #Install Nginx if not installed
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install nginx -y
            fi

            #Create necessary directories
            sudo mkdir -p /var/www/staging/releases

            #Set ownership
            sudo chown -R ubuntu:ubuntu /var/www

            #Replace nginx default config file with the one in /tmp
            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            #Test
            sudo nginx -t

            #Restart nginx
            sudo systemctl restart nginx

          "

      - name: Deploy to Staging
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "
            set -e  #Exit if any command fails

            #Ensure release folder exists
            mkdir -p /var/www/staging/releases

            #Create a unique release folder with timestamp
            NEW_RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            mkdir -p \$NEW_RELEASE
            echo "Deploying to:" \$NEW_RELEASE

            #Upload all files to the new release
            rsync -av --delete ~/devops-project/web/ \$NEW_RELEASE

            #Update symlink so that Nginx serves the new release from the staging folder
            ln -sfn \$NEW_RELEASE /var/www/staging/current
            echo "Deployment complete"
          "

      - name: Test Staging Deployment (Health Check)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.STAGING_SERVER }} "
            STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://${{ env.STAGING_SERVER }}/staging/index.html)
            if [ \'\$STATUS\' -ne 200 ]; then
              echo 'Staging failed'
              exit 1
            else
              echo 'Staging OK'
            fi

          "
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production    #triggers manual approval
    strategy:
      max-parallel: 1    #Rolling deployment
      matrix:
        include:
          - name: prod-1
            ip: 13.61.5.210
            instance_id: i-063e323022cb76eed

          - name: prod-2
            ip: 51.20.79.153
            instance_id: i-0b12b7833aa170718

    env:
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:eu-north-1:191369739072:targetgroup/devops-target-group/7a8a0ac7fd3700d5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deregister from Load Balancer
        run: |
          echo "Deregistering ${{ matrix.name }}

          aws elbv2 deregister-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=${{ matrix.instance_id }}

      - name: Wait for connections to drain
        run: sleep 30

      - name: Prepare Servers
        run: |
          scp -o StrictHostKeyChecking=no nginx/default.conf ubuntu@${{ matrix.ip }}:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt upgrade
              sudo apt install nginx -y
            fi

            sudo mkdir -p /var/www/html
            sudo mkdir -p /var/www/staging/releases
            sudo chown -R ubuntu:ubuntu /var/www

            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            sudo nginx -t
            sudo systemctl restart nginx
          "

      - name: Deploy to Production Server
        run: |

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            RELEASE=/var/www/staging/releases/release-${{ github.sha }}
            mkdir -p \$RELEASE
          "

          rsync -av --delete ./web/ ubuntu@${{ matrix.ip }}:/var/www/staging/releases/release-${{ github.sha }}

          ssh -o StrictHostKeyChecking=no ubuntu@${{matrix.ip }} "
            ln -sfn /var/www/staging/releases/release-${{ github.sha }} /var/www/html/current
          "

      - name: Re-register to Load balancer
        run: |
          echo "Re-registering ${{ matrix.name }}

          aws elbv2 register-targets \
            --target-group-arn $TARGET_GROUP_ARN
            --targets Id=${{ matrix.instance_id }}

      - name: Wait for healthy status
        run: |
          echo "Waiting for ${{ matrix.name }} to become healthy"

          while true; do
            STATUS=$(aws elbv2 describe-target-health \
              --target-group-arn $TARGET_GROUP_ARN \
              --query "TargetHealthDescriptions[?Target.Id=='${{ matrix.instance_id }}'].TargetHealth.State" \
              --output text)

            if [ "$STATUS" = "healthy" ]; then
              echo "${{ matrix.name }} is healthy"
              break
            fi

            echo "Still waiting"
            sleep 10
          done



      - name: Rollback  #Runs if healthcheck fails
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            PREV_RELEASE=\$(ls -dt /var/www/staging/releases/* | sed -n '2p')
            if [ -n \'\$PREV_RELEASE\' ]; then
              ln -sfn \$PREV_RELEASE /var/www/html/current
              echo 'Rollback complete'
            else
              'No previous release to rollback to'
            fi
          "

      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Successful"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Failed!"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
