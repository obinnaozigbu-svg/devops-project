name: Deploy Website (Blue-Green Production)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: prod-1
            ip: 16.170.172.71
            instance_id: i-06e82f94adaa3fe15

          - name: prod-2
            ip: 13.61.187.141
            instance_id: i-046a774e3099ca3a4

    env:
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:eu-north-1:191369739072:targetgroup/devops-target-group/7a8a0ac7fd3700d5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 🔴 Step 1: Remove instance from load balancer
      - name: Deregister from Load Balancer
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=${{ matrix.instance_id }}

      - name: Wait for connections to drain
        run: sleep 30

      # 🔧 Step 2: Prepare server (clean + standardised)
      - name: Prepare Server
        run: |
          scp -o StrictHostKeyChecking=no nginx/default.conf ubuntu@${{ matrix.ip }}:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            set -e

            # Install nginx if missing
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install nginx -y
            fi

            # Create web directory
            sudo mkdir -p /var/www/html/current
            sudo chown -R ubuntu:ubuntu /var/www/html

            # Install nginx config
            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            sudo nginx -t
            sudo systemctl restart nginx
          "

      # 🚀 Step 3: Deploy application (FIXED)
      - name: Deploy to Production Server
        run: |

          # Upload web files directly to server temp folder
          rsync -av --delete ./web/ ubuntu@${{ matrix.ip }}:/tmp/release/

          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            set -e

            # Clean current release
            sudo rm -rf /var/www/html/current/*

            # Deploy new version
            sudo mkdir -p /var/www/html/current
            sudo cp -r /tmp/release/* /var/www/html/current/

            # Fix permissions
            sudo chown -R www-data:www-data /var/www/html/current
          "

      # 🔄 Step 4: Re-add to Load Balancer
      - name: Re-register to Load balancer
        run: |
          aws elbv2 register-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=${{ matrix.instance_id }}

      # 🟢 Step 5: Health check
      - name: Wait for healthy status
        run: |
          echo "Waiting for ${{ matrix.name }} to become healthy"

          while true; do
            STATUS=$(aws elbv2 describe-target-health \
              --target-group-arn $TARGET_GROUP_ARN \
              --query "TargetHealthDescriptions[?Target.Id=='${{ matrix.instance_id }}'].TargetHealth.State" \
              --output text)

            if [ "$STATUS" = "healthy" ]; then
              echo "${{ matrix.name }} is healthy"
              break
            fi

            echo "Still waiting"
            sleep 10
          done

      # 🔙 Step 6: Rollback if failure
      - name: Rollback
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ matrix.ip }} "
            echo 'Rollback triggered'
            sudo rm -rf /var/www/html/current/*
          "

      # 📣 Notifications
      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Successful 🚀"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "Deployment Failed ❌"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
