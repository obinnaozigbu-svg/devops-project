name: Deploy Website (Blue-Green Production)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    env:
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:eu-north-1:191369739072:targetgroup/devops-target-group/7a8a0ac7fd3700d5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Create SNS Topic
        id: sns
        run: |
          ARN=$(aws sns create-topic --name devops-alerts --query 'TopicArn' --output text)
          echo "SNS_TOPIC_ARN=$ARN" >> $GITHUB_ENV
          echo "Created SNS Topic: $ARN"
      
      - name: Subscribe Email to SNS
        run: |
          aws sns subscribe \
            --topic-arn $SNS_TOPIC_ARN \
            --protocol email \
            --notification-endpoint obinnaozigbu@gmail.com

      # Detect ACTIVE server
      - name: Detect Active Server
        id: detect
        run: |
          ACTIVE=$(cat .active_server)
          echo "ACTIVE=$ACTIVE"

          if [ "$ACTIVE" = "prod-1" ]; then
            INACTIVE="prod-2"
            INACTIVE_IP="16.170.218.1"
            INACTIVE_ID="i-0dcbf32bffd8d7044"
            ACTIVE_ID="i-0e08a85f924172943"
          else
            INACTIVE="prod-1"
            INACTIVE_IP="13.61.26.118"
            INACTIVE_ID="i-0e08a85f924172943"
            ACTIVE_ID="i-0dcbf32bffd8d7044"
          fi

          echo "ACTIVE_ID=$ACTIVE_ID" >> $GITHUB_ENV
          echo "INACTIVE_IP=$INACTIVE_IP" >> $GITHUB_ENV
          echo "INACTIVE_ID=$INACTIVE_ID" >> $GITHUB_ENV
          echo "NEW_ACTIVE=$INACTIVE" >> $GITHUB_ENV


      # 🔴 Step 1: Remove instance from load balancer
      - name: Deregister Inactive from Load Balancer
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=$INACTIVE_ID

      - name: Wait for connections to drain
        run: sleep 30

      # 🔧 Step 2: Prepare server (clean + standardised)
      - name: Prepare Server
        run: |
          scp -o StrictHostKeyChecking=no nginx/default.conf ubuntu@$INACTIVE_IP:/tmp/default.conf

          ssh -o StrictHostKeyChecking=no ubuntu@$INACTIVE_IP "
            set -e

            # Install nginx if missing
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install nginx -y
            fi

            # Create web directory
            sudo mkdir -p /var/www/html/current
            sudo chown -R ubuntu:ubuntu /var/www/html

            # Install nginx config
            sudo mv /tmp/default.conf /etc/nginx/sites-available/default

            sudo nginx -t
            sudo systemctl restart nginx
          "

      # 🚀 Step 3: Deploy application (FIXED)
      - name: Deploy to Inactive Server
        run: |

          # Upload web files directly to server temp folder
          rsync -av --delete ./web/ ubuntu@$INACTIVE_IP:/tmp/release/

          ssh -o StrictHostKeyChecking=no ubuntu@$INACTIVE_IP "
            set -e

            # Clean current release
            sudo rm -rf /var/www/html/current/*

            # Deploy new version
            sudo mkdir -p /var/www/html/current
            sudo cp -r /tmp/release/* /var/www/html/current/

            # Fix permissions
            sudo chown -R www-data:www-data /var/www/html/current
          "

      - name: Create CloudWatch Alarm
        run: |
          aws cloudwatch put-metric-alarm \
            --alarm-name "High-CPU-$INACTIVE_ID" \
            --metric-name CPUUtilization \
            --namespace AWS/EC2 \
            --statistic Average \
            --period 60 \
            --threshold 70 \
            --comparison-operator GreaterThanThreshold \
            --dimensions Name=InstanceId,Value=$INACTIVE_ID \
            --evaluation-periods 2 \
            --alarm-actions $SNS_TOPIC_ARN \
            --region eu-north-1


      # STEP 4: Health check inactive server
      - name: Test Inactive Server
        run: |
          echo "Monitoring server after deployment..."

          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$INACTIVE_IP)
            TIME=$(curl -s -o /dev/null -s -w "%{time_total}" http://$INACTIVE_IP)

            echo "Check $i - STATUS: $STATUS | Response Time: $TIME sec"

            if [ "$STATUS" -ne 200 ]; then
              echo "Server became unhealthy after deployment"
              exit 1
            fi

            sleep 10
          done

          echo "Server stable"

     
      # Switch traffic to inactive (Now active)
      - name: Re-register to Load balancer
        run: |
          aws elbv2 register-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=$INACTIVE_ID


      - name: Wait for healthy status
        run: |

          MAX_RETRIES=12   # 12 × 10s = 2 minutes
          COUNT=0

          echo "Waiting for server to become healthy..."

          while [ $COUNT -lt $MAX_RETRIES ]; do
            STATUS=$(aws elbv2 describe-target-health \
            --target-group-arn $TARGET_GROUP_ARN \
            --query "TargetHealthDescriptions[?Target.Id=='$INACTIVE_ID'].TargetHealth.State" \
            --output text)

            if [ "$STATUS" = "healthy" ]; then
              echo "Server is healthy ✅"
              exit 0
            fi

            echo "Still not healthy... attempt $COUNT"
            COUNT=$((COUNT+1))
            sleep 10
          done

          echo "Server failed health check ❌"
          exit 1

      - name: Remove Old Server
        if: success()
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=$ACTIVE_ID

      - name: Update Active Server
        if: success()
        run: |
          echo "$NEW_ACTIVE" > .active_server

          git config user.name "Obinna"
          git config user.email "obinnaozigbu@gmail.com"

          git add .active_server
          git commit -m "Switch server to $NEW_ACTIVE"
          git push

      - name: Rollback Traffic
        if: failure()
        run: |
          echo "Rollback triggered 🚨"

          # Re-register previously active server
          aws elbv2 register-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=$ACTIVE_ID

          # Remove broken deployment from LB
          aws elbv2 deregister-targets \
            --target-group-arn $TARGET_GROUP_ARN \
            --targets Id=$INACTIVE_ID

      - name: Print Deployment Info
        run: |
          echo "Active server: $ACTIVE_ID"
          echo "Deploying to: $INACTIVE_ID ($INACTIVE_IP)"

      # 📣 Notifications
      - name: Notify Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            \"content\": "Deployment Successful 🚀
            New Active IP: $NEW_ACTIVE
            Server: $INACTIVE_ID \"
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            \"content\": "Deployment Failed ❌
            Server: $INACTIVE_ID
            IP: $INACTIVE_IP
            Check logs immediately.\"
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
